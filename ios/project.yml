# Xcode projesi bu dosyadan üretilir (XcodeGen): cd ios && ./build_www.sh && xcodegen generate
# .xcodeproj depoya girmez; iş akışı her derlemede yeniden üretir.
name: LittleBakkal
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "${BAKKAL_BUILD_NUMBER}"
    SWIFT_VERSION: "5.0"
targets:
  LittleBakkal:
    type: application
    platform: iOS
    sources:
      - path: LittleBakkal
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vardiox.littlebakkal
        PRODUCT_NAME: LittleBakkal
        INFOPLIST_FILE: LittleBakkal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        ENABLE_BITCODE: NO
    scheme: {}
