/* Layout: one-screen portrait game. Bottle-green shop chrome around a tiled store floor; paper sheets for morning, report and tuning. */
:root{
  --chrome:#16362b; --chrome-2:#1f4739; --chrome-line:#2f5b4b;
  --on-chrome:#eaf2ec; --on-chrome-muted:#9db7aa;
  --paper:#f2f5f0; --paper-2:#e3e9e1; --field:#ffffff; --ink:#1b2924; --muted:#56675f; --line:#cfd8cd;
  --tag:#f0c032; --tag-ink:#2a2208;
  --good:#2e8b57; --warn:#b67a0c; --bad:#c4473a;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --ui:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--chrome);color:var(--on-chrome);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px}
.hud{position:relative;z-index:30;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px}
.stat{background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:10px;padding:6px 8px;min-width:0;display:flex;flex-direction:column;gap:2px}
.stat .lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--on-chrome-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.neg{color:#ff9c8c}
.repstat{font:inherit;color:inherit;text-align:left;cursor:pointer}
.repbar{display:block;height:4px;border-radius:2px;background:var(--chrome-line);overflow:hidden}
.repbar i{display:block;height:100%;width:50%;background:var(--tag);transition:width .3s}
.ctrls{display:flex;gap:5px}
.icon-btn{width:32px;border-radius:10px;border:1px solid var(--chrome-line);background:var(--chrome-2);color:var(--on-chrome);display:grid;place-items:center;font:600 13px var(--ui);cursor:pointer;padding:0}
.icon-btn svg{width:17px;height:17px;fill:currentColor}
.icon-btn[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:14px;touch-action:none;cursor:pointer;box-shadow:0 0 0 1px var(--chrome-line),0 10px 30px rgba(0,0,0,.35)}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:rgba(13,30,24,.93);color:var(--on-chrome);padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.35;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.bar{display:flex;gap:8px;align-items:center;min-height:42px}
.alerts{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:500;padding:5px 9px;border-radius:999px;background:var(--chrome-2);border:1px solid var(--chrome-line);color:var(--on-chrome-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.warn{background:#3b3313;border-color:#c99a2a;color:#ffd77e}
.btn{font:600 14px var(--ui);border-radius:10px;border:0;padding:11px 16px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--tag);color:var(--tag-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.chrome{background:var(--chrome-2);color:var(--on-chrome);border:1px solid var(--chrome-line);padding:9px 12px;font-size:13px}
.btn.chrome:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--tag);outline-offset:2px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,22,17,.64);display:flex;align-items:center;justify-content:center;
  padding:calc(max(10px, env(safe-area-inset-top,0px)) + 60px) max(16px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.card{color-scheme:light;background:var(--paper);color:var(--ink);border-radius:16px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.4);-webkit-user-select:text;user-select:text}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1;text-wrap:balance;color:var(--chrome)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.head{display:flex;flex-direction:column;gap:6px}
.card p{margin:0;line-height:1.5;color:var(--muted);font-size:14px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.rules li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;line-height:1.45;font-size:14px;align-items:start}
.lg{width:20px;height:20px;margin-top:1px;display:block;position:relative}
.lg.player{border-radius:50%;background:#1f6b4f;box-shadow:0 0 0 2px #fff,0 0 0 3px #1f6b4f}
.lg.shelf{border-radius:4px;background:#6e4a33}
.lg.shelf::after{content:"";position:absolute;inset:5px 4px;background:linear-gradient(90deg,#6fa7d6 0 60%,#efe6d6 60%)}
.lg.reg{border-radius:4px;background:#5b3d2a}
.lg.reg::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:7px;background:#8fd3a0;border-radius:2px}
.lg.truck{border-radius:3px;background:#f4f4f0;box-shadow:inset 0 0 0 2px #2c4a3f}
.lg.truck::after{content:"";position:absolute;right:-1px;top:4px;width:7px;height:12px;background:#2e8b57;border-radius:2px}
.lg.cust{border-radius:50%;background:#e07a5f;box-shadow:0 0 0 2px var(--paper),0 0 0 4px #c4473a}
.lg.tag{border-radius:3px;background:var(--tag);height:13px;margin-top:4px}
.note{background:var(--paper-2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--muted)}
.note b{color:var(--ink)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow.rush{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:520px){.prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.prow:not(.rush) .pname{grid-column:1/-1}}
.pname{display:flex;align-items:center;gap:9px;min-width:0}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.pname b{font-weight:600;display:block}
.pname small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.step{display:flex;flex-direction:column;gap:4px;min-width:0}
.step .lab{font-size:10.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--field);overflow:hidden}
.stepper button{width:34px;height:34px;flex:none;border:0;background:var(--paper-2);font:600 17px var(--ui);color:var(--ink);cursor:pointer}
.stepper output{flex:1;min-width:0;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.step small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn)} .t-good{color:var(--good)}
.total{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;font-variant-numeric:tabular-nums;font-size:14px}
.total b{font-size:16px}

.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin:0;font-variant-numeric:tabular-nums;font-size:14px}
.ledger dt{color:var(--muted)} .ledger dd{margin:0;text-align:right;font-weight:500}
.ledger .sum{border-top:2px solid var(--ink);padding-top:6px;font-weight:700;color:var(--ink)}
.ledger .gap{grid-column:1/-1;height:4px}

.tune{display:flex;flex-direction:column;gap:14px}
.tune label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.tune output{font-variant-numeric:tabular-nums;color:var(--muted)}
.tune input{width:100%;accent-color:var(--chrome)}
.tune small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.inv{display:flex;flex-direction:column;gap:8px}
.invc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.invc b{font-weight:600;font-size:14px}
.invc p{font-size:12.5px;line-height:1.4;grid-column:1}
.invc .btn{grid-column:2;grid-row:1/span 2;padding:9px 12px;font-size:13px}
.invc.done{background:var(--paper-2);border-color:transparent}
.invc .ok{grid-column:2;grid-row:1/span 2;font-size:12px;font-weight:600;color:var(--good)}
.sect{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.news{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){.toast,.repbar i{transition:none}}
</style>

<div id="app">
  <header class="hud" aria-label="Durum">
    <div class="stat"><span class="lbl">Kasa</span><b id="hMoney">3.500 ₺</b></div>
    <div class="stat"><span class="lbl" id="hDay">1. gün</span><b id="hClock">08:00</b></div>
    <button class="stat repstat" id="bRep" type="button" aria-label="İtibar ayrıntıları"><span class="lbl" id="hTier">İtibar</span><b id="hRep">50</b><span class="repbar"><i id="hRepFill"></i></span></button>
    <div class="ctrls">
      <button class="icon-btn" id="bMusic" type="button" aria-label="Müziği kapat" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3.5l10-2v11.2a2.6 2.6 0 1 1-1.6-2.4V5.6L8.6 7v7.7A2.6 2.6 0 1 1 7 12.3z"/></svg></button>
      <button class="icon-btn" id="bPause" type="button" aria-label="Oyunu durdur" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
      <button class="icon-btn" id="bSpeed" type="button" aria-label="Oyun hızı">1,5×</button>
      <button class="icon-btn" id="bTune" type="button" aria-label="Ayarlar"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4" width="16" height="2" rx="1"/><rect x="2" y="9" width="16" height="2" rx="1"/><rect x="2" y="14" width="16" height="2" rx="1"/><circle cx="7" cy="5" r="2.6"/><circle cx="13" cy="10" r="2.6"/><circle cx="6" cy="15" r="2.6"/></svg></button>

  <main class="stage" id="stage">

  </main>
  <footer class="bar">
    <div class="alerts" id="alerts" aria-live="polite"></div>
    <button class="btn chrome" id="bRush" type="button">Acil sipariş</button>
  </footer>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div></div>

function route(a, b) {

    else { o.x += dx / d * budget; o.y += dy / d * budget; budget = 0; }
  }

const NAMES = ['Ayşe', 'Mehmet', 'Zeynep', 'Murat', 'Elif', 'Emre', 'Fatma', 'Can', 'Selin', 'Hasan', 'Derya', 'Kemal', 'Büşra', 'Oğuz'];

const working = () => emps().filter(e => !e.absent);

  const smile = ti === 0 ? rng() * 0.5 : ti === 4 ? 0.4 + rng() * 0.6 : rng(), rel = ti === 0 ? 0.3 + rng() * 0.4 : 0.3 + rng() * 0.7;

function postAd() {

function resetEmpAgent(e, n = 0) { e.a = { x: SPAWN.x - 12 * n, y: SPAWN.y - 20, path: [], task: null, carry: null, station: false }; e.work = 0; }
function empGoStation(e) {
  const a = e.a, role = e.role;

  a.task = null; a.station = false;

function updateEmployees(dt) { for (const e of working()) updateEmployee(e, dt); }
function updateEmployee(e, dt) {
  const a = e.a, sp = PLAYER_SPEED * 0.85 * e.speed;
  if (!a.started) { a.started = true; empGoStation(e); }
  const arrived = moveAlong(a, sp, dt);
  if (!arrived) return;
  if (a.goal === 'station') { a.station = true; return; }
  if (e.role === 'paket') { updatePacker(dt, e, a); return; }
  if (e.role !== 'reyon') return;
  const t = a.task;
  if (!t) {
    const busy = working().filter(x => x !== e && x.a.task && x.a.task.i !== undefined).map(x => x.a.task.i);
    let best = -1, bestF = 0.5;
    PRODUCTS.forEach((pr, i) => { if (!unlocked(i) || S.depot[i] <= 0 || busy.includes(i)) return; const f = S.shelves[i] / capOf(i); if (f <= bestF) { bestF = f; best = i; } });
    if (best < 0) { if (Math.hypot(a.x - IDLE_PT.x, a.y - IDLE_PT.y) > 2) a.path = route(a, IDLE_PT); return; }

  const cap = capOf(t.i);

}
function empEndOfDay(st) {

/* ---------- Paket servis (yalnızca eleman) ---------- */
const PK_PT = { x: 292, y: 64 }, PK_FEE = 15, PK_DUE = 150;
const pkState = () => (S.pk = S.pk || { list: [], motor: null });
function pkSpawn(dt, hourSec) {
  const P = pkState();
  const packers = working().filter(e => e.role === 'paket').length;
  if (!packers || S.closed || P.list.length >= 2 + packers) return;
  const rate = 0.9 * packers * dayMult(S.day) * tier().cust / hourSec;
  if (rng() >= rate * dt) return;
  const pool = PRODUCTS.map((p, i) => ({ i, w: unlocked(i) ? p.weight * demandRamp(i, S.day) : 0 })).filter(x => x.w > 0), items = [];
  const n = 2 + Math.floor(rng() * 3);
  for (let k = 0; k < n && pool.length; k++) {
    const total = pool.reduce((a, b) => a + b.w, 0); let x = rng() * total, idx = 0;
    while (idx < pool.length - 1 && x > pool[idx].w) { x -= pool[idx].w; idx++; }
    items.push(pool[idx].i); pool.splice(idx, 1);
  }
  P.list.push({ id: S.nextId++, items, picked: [], due: S.minute + PK_DUE, state: 'new' });
  toast('Paket siparişi geldi: ' + items.map(i => PRODUCTS[i].name).join(', ') + '. ' + hhmm(S.minute + PK_DUE) + '\'e kadar teslim edilmeli.');
}
function pkCancel(o, why) {
  const P = pkState();
  o.picked.forEach(i => { S.depot[i]++; });
  P.list = P.list.filter(x => x !== o);
  emps().forEach(e => { if (e.a && e.a.task && e.a.task.o === o.id) e.a.task = null; });
  if (why) { S.stats.pkLate++; addRep(-2, 'paketgec'); toast('Paket siparişi gecikti, müşteri iptal etti.'); }
}
function pkUpdate(dt) {
  const P = pkState();
  for (const o of P.list.slice()) if (S.minute > o.due && o.state !== 'ready') pkCancel(o, true);
  const m = P.motor;
  if (!m) return;
  if (m.state === 'in') { m.x += 110 * dt; if (m.x >= 262) { m.x = 262; m.state = 'wait'; m.t = 0; } }
  else if (m.state === 'out') { m.x += 140 * dt; if (m.x > W + 40) P.motor = null; }
  else if (!P.list.some(o => o.state === 'ready')) m.state = 'out';
}
function pkDeliver(o) {
  const P = pkState();
  const sum = o.picked.reduce((a, i) => a + S.prices[i], 0) + (o.picked.length ? PK_FEE : 0);
  const missing = o.items.length - o.picked.length;
  S.money += sum; S.stats.revenue += sum; S.stats.pkRevenue += sum; S.stats.pkDone++;
  S.stats.cogs += o.picked.reduce((a, i) => a + PRODUCTS[i].cost, 0);
  if (missing) { S.stats.pkMissing += missing; addRep(-0.5 * missing, 'paketeksik'); } else addRep(0.6, 'paket');
  P.list = P.list.filter(x => x !== o);
  bubble(PK_PT.x, PK_PT.y, '+' + fmt(sum), 'good');
}
function updatePacker(dt, e, a) {
  const P = pkState();
  let t = a.task;
  if (!t) {
    const o = P.list.find(x => x.state === 'new');
    if (!o) { if (Math.hypot(a.x - IDLE_PT.x, a.y - IDLE_PT.y) > 2) a.path = route(a, IDLE_PT); return; }
    o.state = 'picking'; t = a.task = { o: o.id, k: 0, phase: 'go', t: 0 };
  }
  const o = P.list.find(x => x.id === t.o);
  if (!o) { a.task = null; return; }
  if (t.phase === 'go') {
    if (t.k >= o.items.length) { t.phase = 'door'; a.path = route(a, PK_PT); return; }
    const i = o.items[t.k], src = S.shelves[i] > 0 ? 'shelf' : S.depot[i] > 0 ? 'depot' : null;
    if (!src) { t.k++; return; }
    t.src = src; t.phase = 'take'; t.t = 0; a.path = route(a, src === 'shelf' ? stockPt(i) : DEPOT_PT); return;
  }
  if (t.phase === 'take') {
    t.t += dt; if (t.t < 0.6 / e.speed) return;
    const i = o.items[t.k];
    if (t.src === 'shelf' && S.shelves[i] > 0) { S.shelves[i]--; o.picked.push(i); }
    else if (S.depot[i] > 0) { S.depot[i]--; o.picked.push(i); }
    S.stats.empWork++; e.work = (e.work || 0) + 1; t.k++; t.phase = 'go'; return;
  }
  if (t.phase === 'door') { o.state = 'ready'; t.phase = 'wait'; t.t = 0; if (!P.motor) P.motor = { x: -30, state: 'in', t: 0 }; return; }
  if (t.phase === 'wait') {
    const m = P.motor;
    if (!m) { P.motor = { x: -30, state: 'in', t: 0 }; return; }
    if (m.state === 'wait') { t.t += dt; if (t.t >= 0.8) { pkDeliver(o); m.state = 'out'; a.task = null; } }
  }
}

  S.loan = { amount: amt, left: total, daily: Math.ceil(total / LOAN_DAYS / 10) * 10, days: LOAN_DAYS, missed: 0 };
  S.money += amt; S.loanDraft = 0;
  render(); toast(fmt(amt) + ' kredi kasaya geçti. ' + LOAN_DAYS + ' gün boyunca her akşam ' + fmt(S.loan.daily) + ' taksit düşecek.');
}
const payoffAmount = () => (S.loan ? Math.round(S.loan.left * (1 - EARLY_DISC)) : 0);

  } else {
    L.missed++; st.loanMissed = true;
    L.left += Math.round(due * 0.1);

  }
}

const waitingTruck = () => S.deliveries.find(d => d.status === 'waiting');

      else d.eta = S.minute + 10;
    }
  }
  const w = waitingTruck();
  if (!w || stationed('sign')) return;

  if (w.wait <= 0) {
    w.status = 'coming'; w.eta = S.minute + 60;
    S.money -= FEE; S.stats.fees += FEE;
    const p = S.player; if (p.task && p.task.type === 'sign') p.task = null;

/* ---------- Gün akışı ---------- */
function step(dt) {
  const hourSec = T.dayMin * 60 / 12;

  if (!S.closed) {
    if (S.minute >= CLOSE) { S.closed = true; toast('Saat 20:00, kapıyı kapattın. İçerideki müşteriler çıkınca gün biter.'); }
    else {
      const h = clamp(Math.floor(S.minute / 60) - 8, 0, HOURLY.length - 1);
      const rate = HOURLY[h] * T.density * dayMult(S.day) * tier().cust / hourSec;
      if (rng() < rate * dt) spawnCustomer();
    }
  }
  updateCars(dt);
  pkSpawn(dt, hourSec);
  pkUpdate(dt);
  updateDeliveries(dt);
  updatePlayer(dt);
  updateCustomers(dt);
  updateEmployees(dt);
  serveFront(S.queue, queueSpot, atRegister(0) || !!empAt('kasa'), scanNeed, pay, dt);
  if (S.up.kasa2) serveFront(qArr(1), queueSpot2, atRegister(1) || !!empAt('kasa2'), scanNeed, pay, dt);
  serveFront(S.sarkQueue, sarkSpot, atSark() || !!empAt('sark'), sarkNeed, finishSark, dt);
  if (S.closed && S.customers.length === 0) endDay();
}
function endDay() {

  S.deliveries = [];
  cancelTask();
  if (S.up.manav) PRODUCTS.forEach((p, i) => {
    if (p.dept !== 'manav') return;
    let rot = Math.round((S.shelves[i] + S.depot[i]) * SPOIL);
    st.spoiled += rot * p.cost;
    const fromDepot = Math.min(rot, S.depot[i]); S.depot[i] -= fromDepot; rot -= fromDepot;
    S.shelves[i] = Math.max(0, S.shelves[i] - rot);
  });
  { const P = pkState(); P.list.slice().forEach(o => pkCancel(o, false)); P.motor = null; }
  empEndOfDay(st);

}

function handleTap(x, y) {
  if (S.phase !== 'day' || modal) return;
  S.fx.push({ x, y, t: 0 });
  if (y < 104 && x > 268) {
    if (waitingTruck()) assign({ type: 'sign', t: 0 }, SIGN_PT);
    else toast('Kapıda kamyon yok. Sabah siparişi 09:30–11:30 arası gelir.');
    return;
  }
  for (let i = 0; i < 9; i++) {
    const r = shelfRect(i);
    if (x >= r.x - 6 && x <= r.x + r.w + 6 && y >= r.y - 18 && y <= r.y + r.h + 30) {
      if (unlocked(i)) startStock(i); else toast('Manav kilitli. Sabah ekranındaki Yatırımlar bölümünden açabilirsin.');
      return;
    }
  }
  if (x >= 290 && y >= 432 && y <= 592) {
    if (!S.up.sark) { toast('Şarküteri kilitli. Sabah ekranındaki Yatırımlar bölümünden açabilirsin.'); return; }
    if (x >= 364) { if (empWith('sark')) { toast('Tezgâhta ' + empWith('sark').name + ' var.'); return; } if (!atSark()) assign({ type: 'sark' }); return; }
    if (y >= VIMG.y && y <= VIMG.y + VIMG.h) { let best = 9; for (let i = 9; i < 12; i++) { const r = vitrinCell(i); if (Math.abs(y - (r.y + r.h / 2)) < Math.abs(y - (vitrinCell(best).y + vitrinCell(best).h / 2))) best = i; } startStock(best); return; }
  }
  if (x < 112 && y > 440 && y < 690 && (S.up.kasa2 || y > 530)) {
    const k = S.up.kasa2 && y < 560 ? 1 : 0;
    const e = empWith(regRole(k));
    if (e) { toast((k ? 'İkinci kasada ' : 'Kasada ') + e.name + ' var.'); return; }
    if (!atRegister(k)) assign({ type: 'register', k });
    return;
  }
  if (x < 262 && y < 104) { toast('Depo. Mal dizmek için rafa dokun; depodan alıp kendin götürürsün.'); return; }
  assign({ type: 'walk' }, { x: clamp(x, 18, 360), y: clamp(y, 48, 696) });
}

    const cols = Math.ceil(cap / 2);

let lastHud = 0, lastAlerts = '';
function updateHud(now, force) {
  if (!force && now - lastHud < 120) return;
  lastHud = now;
  $('hMoney').textContent = fmt(S.money);
  $('hMoney').classList.toggle('neg', S.money < 0);
  $('hDay').textContent = S.day + '. gün';
  $('hClock').textContent = hhmm(Math.min(S.minute, 1439));
  $('hRep').textContent = Math.round(S.rep) + (S.phase === 'day' ? '' : '');
  $('hTier').textContent = tier().name;
  $('hRepFill').style.width = S.rep + '%';
  $('bRush').disabled = S.phase !== 'day' || S.closed || S.minute > RUSH_LAST;
  const chips = [];
  if (S.phase === 'day') {
    if (S.closed) chips.push(['', 'Kapandı, son müşteriler']);
    const w = waitingTruck();
    if (w) chips.push(['bad', 'Kamyon kapıda · ' + Math.ceil(Math.max(0, w.wait)) + ' sn']);
    const qn = S.queue.length, sn = S.sarkQueue.length;
    if (qn && !atRegister(0) && !empAt('kasa')) chips.push([qn >= 3 ? 'bad' : 'warn', 'Kasada ' + qn + ' kişi']);
    const q2 = (S.queue2 || []).length;
    if (q2 && !atRegister(1) && !empAt('kasa2')) chips.push([q2 >= 3 ? 'bad' : 'warn', '2. kasada ' + q2 + ' kişi']);
    if (sn && !atSark()) chips.push([sn >= 3 ? 'bad' : 'warn', 'Tezgâhta ' + sn + ' kişi']);
    if (S.pk && S.pk.list.length) chips.push([S.pk.list.some(o => o.due - S.minute < 40) ? 'bad' : '', 'Paket: ' + S.pk.list.length + ' sipariş']);
    const empty = PRODUCTS.filter((p, i) => unlocked(i) && S.shelves[i] === 0).map(p => p.name);
    if (empty.length) chips.push(['warn', 'Boş: ' + empty.join(', ')]);
    const low = PRODUCTS.filter((p, i) => unlocked(i) && S.shelves[i] > 0 && S.shelves[i] <= capOf(i) * 0.25).map(p => p.name);
    if (low.length) chips.push(['', 'Azalan: ' + low.join(', ')]);
    if (!chips.length) chips.push(['', atRegister() ? 'Kasadasın, kuyruk yok' : 'Sakin bir an']);
  }
  const html = chips.map(([k, t]) => '<span class="chip ' + k + '">' + t + '</span>').join('');
  if (html !== lastAlerts) { $('alerts').innerHTML = html; lastAlerts = html; }
}

  else if (modal === 'event') html = eventHtml();

let last = performance.now();
function frame(now) {
  const realDt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now;
  if (S.phase === 'day' && !paused && !modal) {
    let sim = realDt * speed;
    while (sim > 0 && S.phase === 'day') { const d = Math.min(sim, 1 / 30); step(d); sim -= d; }
  }
  updateFx(realDt);
  updateMusic(realDt);
  if (now - lastSave > 3000 && S.phase !== 'intro') { lastSave = now; saveGame(); }
  draw(now);
  updateHud(now);
  requestAnimationFrame(frame);
}

    const v = a.volume + Math.sign(target - a.volume) * Math.min(Math.abs(target - a.volume), dt * 0.6);

}

document.addEventListener('pointerdown', () => { musicUnlocked = true; }, { capture: true });

/* ---------- Kayıt: oyun bu cihazda saklanır, sayfa yenilense de kaldığı yerden sürer ---------- */
const SAVE_KEY = 'bakkal.save.v2';
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

let lastSave = 0, confirmNew = false;

  let restored = false;
  try { if (data && data.S && data.S.v === 2) { S = data.S; if (data.T) T = { ...DEFAULT_T, ...data.T }; } else { const saved = loadGame(); if (saved && saved.day >= 1 && saved.phase !== 'intro') { S = saved; restored = true; } } } catch (e) {}

    if (S.phase === 'day') { $('bPause').click(); toast(S.day + '. günden kaldığın yerden devam. Başlamak için durdurma düğmesine bas.'); }
    else toast(S.day + '. günden kaldığın yerden devam ediyorsun.');
  }
}
window.__bakkal = {

  get music() { return Object.fromEntries(Object.entries(tracks).map(([k, x]) => [k, { paused: x.paused, vol: +x.volume.toFixed(2), t: +x.currentTime.toFixed(1) }])); },
  step(sec) { let s = sec; while (s > 0 && S.phase === 'day') { const d = Math.min(s, 1 / 30); step(d); s -= d; } },
  tap: handleTap, act(name, extra) { const el = document.querySelector('[data-act="' + name + '"]' + (extra || '')); if (el) el.click(); },
};
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
